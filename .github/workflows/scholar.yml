name: Update Google Scholar citations
on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC
  workflow_dispatch:       # manual "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python update_scholar.py index.html
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "scholar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Weekly Scholar citation update" && git push)
